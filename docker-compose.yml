# Local dev and test services (TRD § Environments). Start with `pnpm infra:up`.
# Ports bind to localhost only; passwords come from .env.local (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      # Read by packages/db/bootstrap/01-roles.sh on first start only (empty volume).
      CRM_OWNER_PASSWORD: ${CRM_OWNER_PASSWORD:?}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?}
      CRM_AUTH_PASSWORD: ${CRM_AUTH_PASSWORD:?}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"] # set POSTGRES_PORT if a local Postgres owns 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
