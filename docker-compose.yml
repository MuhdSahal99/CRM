# Local dev and test services (TRD § Environments). Start with `pnpm infra:up`.
# Ports bind to localhost only; passwords come from .env.local (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      # Read by packages/db/bootstrap/01-roles.sh on first start only (empty volume).
      CRM_OWNER_PASSWORD: ${CRM_OWNER_PASSWORD:?}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?}
      CRM_AUTH_PASSWORD: ${CRM_AUTH_PASSWORD:?}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"] # set POSTGRES_PORT if a local Postgres owns 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Object storage for PDFs and imports (ADR-0012). Opt-in: `pnpm infra:storage`. Needs S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY and S3_BUCKET in .env.local.
  # The upstream minio/minio image is no longer published, so this is Bitnami's archived MinIO, pinned by digest: dev only, never prod (PRODUCTION_READINESS).
  minio:
    profiles: ["storage"]
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-}
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
  miniodata:
